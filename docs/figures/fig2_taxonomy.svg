<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    .ttl{font-size:13px;font-weight:bold;fill:#111;}
    .lab{font-size:12px;fill:#111;}
    .small{font-size:11px;fill:#444;}
    .node{fill:#fff;stroke:#555;stroke-width:1.3;}
    .gnode{fill:#dcfce7;stroke:#16a34a;stroke-width:1.6;}
    .panel{fill:#fafafa;stroke:#ccc;stroke-width:1.2;rx:8;}
    .good{font-size:12px;font-weight:bold;fill:#16a34a;}
    .bad{font-size:12px;font-weight:bold;fill:#dc2626;}
  </style>

  <text x="20" y="26" class="ttl">Why execution helps some faults and not others: control-flow signals vs. data-level faults</text>
  <text x="20" y="44" class="small">Coverage / traceback / SBFL record WHICH lines ran. They locate the fault only when the fault changes the control flow.</text>

  <!-- LEFT PANEL: control-flow-distinct -->
  <rect class="panel" x="20" y="60" width="415" height="340" rx="8"/>
  <text x="36" y="86" class="ttl">(a) Control-flow-distinct fault</text>
  <text x="36" y="104" class="small">Failing input drives a DIFFERENT path; gold line is on it.</text>

  <!-- CFG sketch L: fork, failing path highlighted, gold on failing branch -->
  <circle class="node" cx="120" cy="150" r="18"/>
  <text x="120" y="154" text-anchor="middle" class="small">entry</text>
  <!-- branch -->
  <circle class="node" cx="120" cy="220" r="18"/>
  <text x="120" y="224" text-anchor="middle" class="small">branch</text>
  <line x1="120" y1="168" x2="120" y2="202" class="node" marker-end="url(#a)"/>
  <!-- passing path (left) -->
  <circle class="node" cx="60" cy="300" r="18"/>
  <text x="60" y="304" text-anchor="middle" class="small">pass</text>
  <path d="M104,232 L74,288" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <!-- failing path (right) -->
  <circle class="gnode" cx="190" cy="300" r="20"/>
  <text x="190" y="298" text-anchor="middle" class="small" fill="#166534">GOLD</text>
  <text x="190" y="312" text-anchor="middle" class="small" fill="#166534">line</text>
  <path d="M136,232 L176,286" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="158" y="262" class="small" fill="#16a34a">failing</text>

  <text x="250" y="170" class="small">Failing-only lines</text>
  <text x="250" y="186" class="small">appear in coverage.</text>
  <text x="250" y="210" class="good">✓ coverage filter helps</text>
  <text x="250" y="228" class="good">✓ SBFL differential ≠ ∅</text>
  <text x="250" y="246" class="good">✓ traceback points near</text>

  <line x1="36" y1="338" x2="419" y2="338" stroke="#ccc" stroke-width="1"/>
  <text x="36" y="360" class="small" font-weight="bold">Example: matplotlib-22711</text>
  <text x="36" y="378" class="small">93 lines run only under failure; 5 / 13 gold</text>
  <text x="36" y="392" class="small">lines lie in that failing-only set.</text>

  <!-- RIGHT PANEL: data-level -->
  <rect class="panel" x="465" y="60" width="415" height="340" rx="8"/>
  <text x="481" y="86" class="ttl">(b) Data-level fault</text>
  <text x="481" y="104" class="small">Same path runs; wrong VALUE, or fix is on a skipped branch.</text>

  <!-- CFG sketch R: same straight path runs in both; gold runs but value wrong -->
  <circle class="node" cx="560" cy="150" r="18"/>
  <text x="560" y="154" text-anchor="middle" class="small">entry</text>
  <circle class="gnode" cx="560" cy="230" r="20" stroke="#dc2626" fill="#fee2e2"/>
  <text x="560" y="227" text-anchor="middle" class="small" fill="#991b1b">GOLD</text>
  <text x="560" y="241" text-anchor="middle" class="small" fill="#991b1b">runs, bad value</text>
  <circle class="node" cx="560" cy="310" r="18"/>
  <text x="560" y="314" text-anchor="middle" class="small">exit</text>
  <line x1="560" y1="168" x2="560" y2="208" class="node" marker-end="url(#a)"/>
  <line x1="560" y1="252" x2="560" y2="290" class="node" marker-end="url(#a)"/>
  <text x="528" y="282" text-anchor="end" class="small">runs in</text>
  <text x="528" y="296" text-anchor="end" class="small">pass &amp; fail</text>

  <text x="620" y="170" class="small">Gold also runs in passing</text>
  <text x="620" y="186" class="small">tests → no differential.</text>
  <text x="620" y="212" class="bad">✗ SBFL differential = ∅</text>
  <text x="620" y="230" class="bad">✗ no ranking signal</text>
  <text x="620" y="248" class="small">(only membership = filter)</text>

  <line x1="481" y1="338" x2="864" y2="338" stroke="#ccc" stroke-width="1"/>
  <text x="481" y="360" class="small" font-weight="bold">Examples: astropy-14182 (0/14 gold in</text>
  <text x="481" y="376" class="small">failing-only) · django-14017 (fix on a</text>
  <text x="481" y="392" class="small">missed branch the buggy run never took).</text>
</svg>
